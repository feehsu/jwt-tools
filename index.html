<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>JWT Tools - Studio Pro</title>
  <link rel="stylesheet" href="style.css" />
  <link rel="stylesheet" href="jwt-compare.css" />
  <script src="https://cdnjs.cloudflare.com/ajax/libs/crypto-js/4.1.1/crypto-js.min.js"></script>
</head>
<body>
  <header class="app-header">
    <div class="header-title">
      JWT Tools - Studio Pro
    </div>
    <div class="header-controls">
      <label class="auto-sync-label">
        <input type="checkbox" id="chk-auto-sync" checked />
        <span>Auto Sync</span>
      </label>
    </div>
  </header>

  <main class="main-container">
    <!-- PANEL 1: ENCODED JWT -->
    <section class="panel panel-encoded">
      <div class="panel-header">
        <span class="panel-label">ENCODED JWT</span>
        <button id="btn-copy-encoded-top" class="btn btn-secondary">Copy</button>
      </div>

      <div class="panel-content panel-encoded-content">
        <textarea
          id="jwt-encoded-input"
          class="jwt-textarea jwt-compact-input"
          placeholder="Paste your encoded JWT here..."
          spellcheck="false"
        ></textarea>
      </div>

      <div class="panel-fixed-footer">
        <div class="secret-key-block">
          <label for="secret-key-input">Secret Key (HMAC SHA256):</label>
          <div class="secret-key-input-wrapper">
            <input
              type="text"
              id="secret-key-input"
              class="input-text"
              placeholder="your-256-bit-secret"
              value="your-256-bit-secret"
              spellcheck="false"
            />
            <span id="secret-validation-badge" class="badge badge-invalid">INVALID</span>
          </div>
        </div>
        <button id="btn-copy-encoded-bottom" class="btn btn-primary full-width">Copy Encoded</button>
      </div>
    </section>

    <!-- PANEL 2: RAW JSON -->
    <section class="panel panel-raw">
      <div class="panel-header">
        <span class="panel-label">RAW JSON</span>
        <div class="header-actions">
          <button id="btn-toggle-all-raw" class="btn btn-secondary btn-sm">Expand/Collapse All</button>
          <button id="btn-copy-raw-top" class="btn btn-secondary">Copy</button>
        </div>
      </div>

      <div class="panel-sub-header">
        <div class="search-input-wrapper">
          <svg class="search-icon" viewBox="0 0 24 24" width="16" height="16" fill="none" stroke="currentColor" stroke-width="2">
            <circle cx="11" cy="11" r="8"></circle>
            <line x1="21" y1="21" x2="16.65" y2="16.65"></line>
          </svg>
          <input
            type="text"
            id="raw-search-input"
            class="input-search"
            placeholder="Highlight json content..."
          />
        </div>
      </div>

      <div class="panel-content raw-column-content">
        <div class="header-json-block">
          <div class="block-title">HEADER</div>
          <div id="raw-header-container" class="code-editor-container"></div>
        </div>

        <div class="payload-json-block">
          <div class="block-title">PAYLOAD</div>
          <div id="raw-payload-container" class="code-editor-container"></div>
        </div>
      </div>

      <div class="panel-fixed-footer">
        <button id="btn-copy-raw-bottom" class="btn btn-primary full-width">Copy Raw Payload</button>
      </div>
    </section>

    <!-- PANEL 3: PRETTY BUILDER -->
    <section class="panel panel-pretty">
      <div class="panel-header">
        <span class="panel-label">PRETTY BUILDER</span>
        <button id="btn-toggle-all-pretty" class="btn btn-secondary btn-sm">Expand/Collapse All</button>
      </div>

      <div class="panel-sub-header">
        <div class="search-input-wrapper">
          <svg class="search-icon" viewBox="0 0 24 24" width="16" height="16" fill="none" stroke="currentColor" stroke-width="2">
            <circle cx="11" cy="11" r="8"></circle>
            <line x1="21" y1="21" x2="16.65" y2="16.65"></line>
          </svg>
          <input
            type="text"
            id="pretty-search-input"
            class="input-search"
            placeholder="Filter claims and values..."
          />
        </div>
      </div>

      <div class="panel-content pretty-builder-content">
        <div id="pretty-builder-accordion" class="accordion-list"></div>
      </div>
    </section>
  </main>

  <hr class="section-divider" />

  <!-- SECTION: JWT COMPARATOR -->
  <section id="jwt-comparator" class="comparator-section">
    <div class="comparator-header">
      <h2 class="comparator-title">
        JWT Comparator
        <a href="#jwt-comparator" class="anchor-link" title="Direct link">🔗</a>
      </h2>
      <div class="comparator-controls">
        <div class="search-input-wrapper comparator-search-wrapper">
          <svg class="search-icon" viewBox="0 0 24 24" width="16" height="16" fill="none" stroke="currentColor" stroke-width="2">
            <circle cx="11" cy="11" r="8"></circle>
            <line x1="21" y1="21" x2="16.65" y2="16.65"></line>
          </svg>
          <input
            type="text"
            id="comparator-search-input"
            class="input-search"
            placeholder="Filter claims..."
          />
        </div>
        <div class="tabs-nav">
          <button id="comp-tab-pretty" class="tab-btn active">Pretty</button>
          <button id="comp-tab-raw" class="tab-btn">Raw JSON</button>
        </div>
      </div>
    </div>

    <div class="comparator-inputs-grid">
      <div class="comparator-input-card">
        <div class="card-header">
          <label>JWT A</label>
          <div class="card-header-btns">
            <button id="btn-copy-encoded-a" class="btn btn-secondary btn-sm">Copy Encoded</button>
          </div>
        </div>
        <textarea id="comparator-jwt-a" class="jwt-textarea comparator-textarea" placeholder="Paste JWT A..."></textarea>
      </div>

      <div class="comparator-input-card">
        <div class="card-header">
          <label>JWT B</label>
          <div class="card-header-btns">
            <button id="btn-copy-encoded-b" class="btn btn-secondary btn-sm">Copy Encoded</button>
          </div>
        </div>
        <textarea id="comparator-jwt-b" class="jwt-textarea comparator-textarea" placeholder="Paste JWT B..."></textarea>
      </div>
    </div>

    <div id="comparator-view-pretty" class="comparator-view active">
      <div class="comparator-diff-grid">
        <div class="diff-col">
          <div class="col-title-bar">
            <span class="col-title">JWT A - Pretty</span>
            <div class="col-actions">
              <button id="btn-toggle-comp-pretty-a" class="btn btn-secondary btn-sm">Expand/Collapse All</button>
            </div>
          </div>
          <div id="comp-pretty-a-accordion" class="accordion-list scrollable-code"></div>
        </div>
        <div class="diff-col">
          <div class="col-title-bar">
            <span class="col-title">JWT B - Pretty</span>
            <div class="col-actions">
              <button id="btn-toggle-comp-pretty-b" class="btn btn-secondary btn-sm">Expand/Collapse All</button>
            </div>
          </div>
          <div id="comp-pretty-b-accordion" class="accordion-list scrollable-code"></div>
        </div>
      </div>
    </div>

    <div id="comparator-view-raw" class="comparator-view">
      <div class="comparator-diff-grid">
        <div class="diff-col">
          <div class="col-title-bar">
            <span class="col-title">JWT A - Raw JSON</span>
            <div class="col-actions">
              <button id="btn-toggle-comp-raw-a" class="btn btn-secondary btn-sm">Expand/Collapse All</button>
              <button id="btn-copy-json-a" class="btn btn-secondary btn-sm">Copy JSON</button>
            </div>
          </div>
          <div id="comp-raw-a-container" class="code-editor-container scrollable-code"></div>
        </div>
        <div class="diff-col">
          <div class="col-title-bar">
            <span class="col-title">JWT B - Raw JSON</span>
            <div class="col-actions">
              <button id="btn-toggle-comp-raw-b" class="btn btn-secondary btn-sm">Expand/Collapse All</button>
              <button id="btn-copy-json-b" class="btn btn-secondary btn-sm">Copy JSON</button>
            </div>
          </div>
          <div id="comp-raw-b-container" class="code-editor-container scrollable-code"></div>
        </div>
      </div>
    </div>
  </section>

  <footer class="app-footer">
    <p>Fat ®</p>
  </footer>

  <script src="app.js"></script>
  <script src="jwt-compare.js"></script>
</body>
</html>
