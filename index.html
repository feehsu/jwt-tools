<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>JWT Tools - Studio Pro</title>
    <link rel="stylesheet" href="styles.css">
    <script src="https://cdnjs.cloudflare.com/ajax/libs/crypto-js/4.1.1/crypto-js.min.js"></script>
</head>
<body>

    <div class="header">
        <h1>JWT Tools - Studio Pro</h1>
        <div class="sync-option">
            <label>
                <input type="checkbox" id="auto-sync" checked>
                Auto Sync
            </label>
        </div>
    </div>

    <div class="main-container">
        <div class="panel-left">
            <div class="panel-header">
                <h3>Encoded JWT</h3>
                <div class="actions-group">
                    <button class="btn-action" id="btn-decode-manual" style="display: none;">Decode &gt;</button>
                    <button class="btn-copy" id="btn-copy-encoded-top">Copy</button>
                </div>
            </div>
            
            <textarea id="encoded" placeholder="Paste your encoded JWT here..."></textarea>
            <div class="error-msg" id="error-encoded"></div>

            <div class="secret-box">
                <label for="secret-key">Secret Key (HMAC SHA256):</label>
                <input type="text" id="secret-key" placeholder="your-256-bit-secret">
            </div>

            <div class="panel-footer">
                <button class="btn-copy" id="btn-copy-encoded-bottom">Copy Encoded</button>
            </div>
        </div>

        <div class="panel-right">
            <div class="tabs">
                <button class="tab-btn active" id="tab-btn-raw">Raw JSON</button>
                <button class="tab-btn" id="tab-btn-pretty">Pretty Builder</button>
            </div>

            <div class="tab-content active" id="tab-raw">
                <div class="panel-header">
                    <h3>Raw Editor</h3>
                    <div class="actions-group">
                        <button class="btn-action" id="btn-encode-manual" style="display: none;">&lt; Encode</button>
                        <button class="btn-copy" id="btn-copy-decoded-top">Copy JSON</button>
                    </div>
                </div>
                
                <div id="decoded-editor" contenteditable="true" class="highlight-editor" spellcheck="false"></div>
                <div class="error-msg" id="error-decoded"></div>

                <div class="panel-footer">
                    <button class="btn-copy" id="btn-copy-decoded-bottom">Copy Raw</button>
                </div>
            </div>

            <div class="tab-content" id="tab-pretty">
                <div id="pretty-builder"></div>
                
                <div class="panel-footer" style="margin-top: 15px;">
                    <button class="btn-copy" id="btn-copy-pretty-bottom">Copy Current JSON</button>
                </div>
            </div>
        </div>
    </div>

    <hr class="section-divider">

    <div class="comparator-container">
        <h2>JWT Comparator</h2>
        
        <div class="comparator-grid">
            <div class="comparator-card">
                <h3>Token 1</h3><br>
                <textarea id="comp-jwt-1" placeholder="Paste first JWT..."></textarea>
                
                <div class="tabs" style="margin-top: 10px;">
                    <button class="tab-btn active" id="comp1-tab-raw">Raw</button>
                    <button class="tab-btn" id="comp1-tab-pretty">Pretty</button>
                </div>

                <div id="comp-1-raw" class="tab-content active">
                    <div class="highlight-editor" id="comp-1-raw-text"></div>
                </div>
                <div id="comp-1-pretty" class="tab-content"></div>
            </div>

            <div class="comparator-card">
                <h3>Token 2</h3><br>
                <textarea id="comp-jwt-2" placeholder="Paste second JWT..."></textarea>
                
                <div class="tabs" style="margin-top: 10px;">
                    <button class="tab-btn active" id="comp2-tab-raw">Raw</button>
                    <button class="tab-btn" id="comp2-tab-pretty">Pretty</button>
                </div>

                <div id="comp-2-raw" class="tab-content active">
                    <div class="highlight-editor" id="comp-2-raw-text"></div>
                </div>
                <div id="comp-2-pretty" class="tab-content"></div>
            </div>
        </div>
    </div>

    <script src="app.js"></script>
</body>
</html>
