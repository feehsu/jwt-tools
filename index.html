<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>JWT Tools - Studio Pro</title>
  <link rel="stylesheet" href="styles.css" />
  <script src="https://cdnjs.cloudflare.com/ajax/libs/crypto-js/4.1.1/crypto-js.min.js"></script>
</head>
<body>
  <header class="app-header">
    <div class="header-title">JWT Tools - Studio Pro</div>
    <div class="header-controls">
      <label class="auto-sync-label">
        <input type="checkbox" id="chk-auto-sync" checked />
        <span>Auto Sync</span>
      </label>
    </div>
  </header>

  <main class="main-container">
    <section class="panel panel-left">
      <div class="panel-header">
        <span class="panel-label">ENCODED JWT</span>
        <button id="btn-copy-encoded-top" class="btn btn-secondary">Copy</button>
      </div>

      <div class="panel-content">
        <div class="jwt-editor-wrapper">
          <div id="jwt-highlight-overlay" class="jwt-highlight-overlay"></div>
          <textarea
            id="jwt-encoded-input"
            class="jwt-textarea"
            placeholder="Paste your encoded JWT or Payload here..."
            spellcheck="false"
          ></textarea>
        </div>
      </div>

      <div class="panel-fixed-footer">
        <div class="secret-key-block">
          <label for="secret-key-input">Secret Key (HMAC SHA256):</label>
          <div class="secret-key-input-wrapper">
            <input
              type="text"
              id="secret-key-input"
              class="input-text"
              placeholder="your-256-bit-secret"
              value="your-256-bit-secret"
              spellcheck="false"
            />
            <span id="secret-validation-badge" class="badge badge-invalid">INVALID</span>
          </div>
        </div>
        <button id="btn-copy-encoded-bottom" class="btn btn-primary full-width">Copy Encoded</button>
      </div>
    </section>

    <section class="panel panel-right">
      <div class="panel-tabs-header">
        <div class="tabs-nav">
          <button id="tab-btn-raw" class="tab-btn">Raw JSON</button>
          <button id="tab-btn-pretty" class="tab-btn active">Pretty Builder</button>
        </div>
      </div>

      <div id="tab-content-raw" class="tab-content">
        <div class="tab-sub-header">
          <button id="btn-copy-decoded-top" class="btn btn-secondary">Copy JSON</button>
        </div>
        <div class="panel-content">
          <textarea
            id="raw-json-textarea"
            class="code-textarea"
            placeholder="{ &quot;sub&quot;: &quot;1234567890&quot;... }"
            spellcheck="false"
          ></textarea>
        </div>
        <div class="panel-fixed-footer">
          <button id="btn-copy-decoded-bottom" class="btn btn-primary full-width">Copy Raw</button>
        </div>
      </div>

      <div id="tab-content-pretty" class="tab-content active">
        <div class="tab-sub-header pretty-sub-header">
          <div class="search-input-wrapper">
            <svg class="search-icon" viewBox="0 0 24 24" width="16" height="16" fill="none" stroke="currentColor" stroke-width="2">
              <circle cx="11" cy="11" r="8"></circle>
              <line x1="21" y1="21" x2="16.65" y2="16.65"></line>
            </svg>
            <input
              type="text"
              id="pretty-search-input"
              class="input-search"
              placeholder="Filter claims and values..."
            />
          </div>
          <button id="btn-copy-pretty-top" class="btn btn-secondary btn-copy-json-pretty">Copy JSON</button>
        </div>

        <div class="panel-content pretty-builder-content">
          <div id="pretty-builder-accordion" class="accordion-list"></div>
        </div>

        <div class="panel-fixed-footer">
          <button id="btn-copy-pretty-bottom" class="btn btn-primary full-width">Copy Current JSON</button>
        </div>
      </div>
    </section>
  </main>

  <hr class="section-divider" />

  <section class="comparator-section">
    <h2 class="comparator-title">JWT Comparator</h2>
    <div class="comparator-grid">
      <div class="comparator-col">
        <label>JWT A</label>
        <textarea id="comparator-jwt-a" class="code-textarea comparator-textarea" placeholder="Paste JWT A..."></textarea>
      </div>
      <div class="comparator-col">
        <label>JWT B</label>
        <textarea id="comparator-jwt-b" class="code-textarea comparator-textarea" placeholder="Paste JWT B..."></textarea>
      </div>
    </div>
    <div id="comparator-result" class="comparator-result"></div>
  </section>

  <script src="app.js"></script>
</body>
</html>
